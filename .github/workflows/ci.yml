name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[surface,dev,report]"
      - name: Lint
        run: uv run ruff check src tests scripts recipes
      - name: Tests
        run: uv run pytest tests/ -q -m "not gpu and not network and not slow and not torch"
