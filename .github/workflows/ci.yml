name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately without the generation extra. The core package depends
      # only on pyyaml and every heavy import is lazy, so the whole test suite
      # runs without torch. Installing it would add minutes for no coverage.
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[surface,dev]"

      - name: Lint
        run: |
          uv run ruff check src tests scripts recipes
          uv run ruff format --check src tests scripts recipes

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest tests/ -q -m "not gpu and not network and not slow"

      - name: Style guard
        run: uv run python scripts/check_style.py

      - name: Shell scripts parse
        run: |
          for script in slurm/*.sh slurm/*.sbatch scripts/*.sh; do
            bash -n "$script"
          done

      # These pin sets are the reason the project has three environments, and
      # nothing else checks that they can still be satisfied. The MetricX one
      # went unresolvable for a while without anyone noticing.
      - name: Metric environment requirements resolve
        run: |
          uv pip compile envs/comet-requirements.txt --quiet -o "${RUNNER_TEMP}/comet.txt"
          uv pip compile envs/metricx-requirements.txt --quiet -o "${RUNNER_TEMP}/metricx.txt"

      - name: Wheel builds and the entry point works
        run: |
          uv build --wheel --out-dir dist
          uv venv --python 3.11 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/mnlp-eval --version
          /tmp/wheel-venv/bin/mnlp-eval info
          # Exercises a command whose imports live in a subpackage, so a
          # subpackage missing from the wheel fails here rather than on a
          # cluster. `info` alone would not reach mnlp_eval.analysis.
          mkdir -p "${RUNNER_TEMP}/nets"
          printf '{"name":"a","components":{"h":{"total":4,"kept":{"0":[0,1]}}}}' \
              > "${RUNNER_TEMP}/nets/a.json"
          printf '{"name":"b","components":{"h":{"total":4,"kept":{"0":[1,2]}}}}' \
              > "${RUNNER_TEMP}/nets/b.json"
          /tmp/wheel-venv/bin/mnlp-eval overlap \
              --subnetwork-dir "${RUNNER_TEMP}/nets" --out "${RUNNER_TEMP}/report"
          grep -q "Excess" "${RUNNER_TEMP}/report/overlap.md"

      - name: Pre-commit hooks
        run: uv run --with pre-commit pre-commit run --all-files

  # The generation loop is the only place hypotheses are reordered, and its
  # tests need torch (though no GPU and no model download). A misalignment
  # there pairs every hypothesis with the wrong reference, so it is worth a
  # separate job and a CPU-only torch wheel.
  generation-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install with CPU torch
        run: |
          uv venv --python 3.11
          uv pip install -e ".[surface,dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        run: uv run pytest tests/ -q -m "not gpu and not network and not slow"
