# Sweep suite. Greedy decoding is roughly three times cheaper than beam 5,
# which is what makes a sparsity sweep and a full transfer matrix affordable.
#
# Scores are NOT comparable with the beam-5 suite or with ALMA's published
# numbers, and the report stage refuses to place runs from the two suites in
# one table. Within the sweep every system is decoded identically, which is
# what the compression and transfer claims actually need.
name: alma10-greedy
data:
  dataset: haoranxu/WMT22-Test
  directions: [cs-en, de-en, is-en, ru-en, zh-en, en-cs, en-de, en-is, en-ru, en-zh]
decode:
  num_beams: 1
  max_new_tokens: 256
  max_source_length: 256
  batch_size: 16
  seed: 42
