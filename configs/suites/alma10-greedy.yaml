# Sweep suite. Greedy decoding, about three times cheaper than beam 5. Scores
# are not comparable with the beam-5 suite or ALMA's published numbers.
name: alma10-greedy
data:
  dataset: haoranxu/WMT22-Test
  directions: [cs-en, de-en, is-en, ru-en, zh-en, en-cs, en-de, en-is, en-ru, en-zh]
decode:
  num_beams: 1
  max_new_tokens: 256
  max_source_length: 256
  batch_size: 16
  seed: 42
