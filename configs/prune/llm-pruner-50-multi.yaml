# LLM-Pruner at 50 percent, calibrated on all ten directions. Needs gradients,
# so a smaller batch_size. No compensation step; LoRA repair is a separate stage.
name: alma-7b-llm-pruner50-multi
method: llm-pruner
model_name_or_path: haoranxu/ALMA-7B
calibration: data/calibration/multi-10dir
sparsity: 0.5
allocation: global
dtype: bfloat16
batch_size: 2
max_length: 512
seed: 1234
