# Smoke test: prunes Qwen2.5-0.5B-Instruct in a few minutes to run the prune,
# repair, generate and score chain end to end. Also covers grouped-query
# attention and tied embeddings.
name: smoke-qwen-slimgpt20
method: slimgpt
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
calibration: data/calibration/pair-de
directions: [de-en, en-de]
sparsity: 0.2
allocation: log-increase
dtype: bfloat16
batch_size: 4
max_length: 512
seed: 1234
