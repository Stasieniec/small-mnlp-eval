# SlimGPT at 50 percent, calibrated on all ten directions, global budget.
# About 26 GB on ALMA-7B; if it does not fit, reduce calibration segments
# rather than max_length.
name: alma-7b-slimgpt50-multi
method: slimgpt
model_name_or_path: haoranxu/ALMA-7B
calibration: data/calibration/multi-10dir
sparsity: 0.5
allocation: global
dtype: bfloat16
batch_size: 4
max_length: 512
seed: 1234
