# FLAP at 50 percent, calibrated on all ten directions. One forward pass, no
# gradients; removed channels are compensated with a bias.
# allocation: global standardises each layer's scores before pooling, see
# src/mnlp_eval/prune/budget.py.
name: alma-7b-flap50-multi
method: flap
model_name_or_path: haoranxu/ALMA-7B
calibration: data/calibration/multi-10dir
sparsity: 0.5
allocation: global
dtype: bfloat16
batch_size: 4
max_length: 512
seed: 1234
