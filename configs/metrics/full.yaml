# Full metric set. COMETKiwi and XCOMET-XL are gated (set HF_TOKEN before
# prefetching); XCOMET-XL needs an A100-class GPU. MetricX runs in its own
# environment (transformers==4.30.2).
groups: [surface, neural, metricx]
comet_models:
  - Unbabel/wmt22-comet-da
  - Unbabel/wmt22-cometkiwi-da
  - Unbabel/XCOMET-XL
metricx_model: google/metricx-24-hybrid-large-v2p6-bfloat16
metricx_tokenizer: google/mt5-xl
comet_batch_size: 16
bootstrap_samples: 1000
compute_ter: true
