# Repair data for LoRA: all of ALMA's human-written parallel data, all ten
# directions, at its natural proportions as in ALMA's LoRA recipe.
#
# No source-length filter, as in ALMA (repair truncates at 511 tokens). A
# 20-character minimum would drop about a tenth of zh-en.
name: repair-multi
dataset: haoranxu/ALMA-Human-Parallel
split: train
directions: [cs-en, de-en, is-en, ru-en, zh-en, en-cs, en-de, en-is, en-ru, en-zh]
segments_per_direction: null
min_source_chars: 1
max_source_chars: 100000
seed: 1234
prompt: alma
