# Calibration data for multi-directional pruning: 128 segments per direction,
# 1,280 in all. Balanced, since Icelandic has 2,009 training pairs against
# Russian's 15,000.
name: multi-10dir
dataset: haoranxu/ALMA-Human-Parallel
split: train
directions: [cs-en, de-en, is-en, ru-en, zh-en, en-cs, en-de, en-is, en-ru, en-zh]
segments_per_direction: 128
seed: 1234
prompt: alma
