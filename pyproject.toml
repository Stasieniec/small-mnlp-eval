[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mnlp-eval"
version = "0.1.0"
description = "Quality and efficiency evaluation for compressed translation LLMs, used to study structured pruning of ALMA-7B."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["machine translation", "evaluation", "structured pruning", "ALMA"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Installed in the generation, COMET and MetricX environments, so heavy
# dependencies go in extras.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
surface = [
  "sacrebleu>=2.4",
  "py3langid>=0.2.2",
]
gen = [
  "torch>=2.1",
  # unbabel-comet requires transformers<5.
  "transformers>=4.45,<5",
  "tokenizers>=0.19,<0.22",
  "accelerate>=0.30",
  "datasets>=3.0,<5",
  "huggingface-hub>=0.24,<1.0",
  "sentencepiece>=0.2",
  "protobuf>=4",
  # for Marian tokenizers
  "sacremoses>=0.1",
  "nvidia-ml-py>=12.535",
]
quant = [
  "bitsandbytes>=0.43",
  "peft>=0.11",
  "optimum>=1.21",
]
# Pruning relies on attention internals as of transformers 4.48.
prune = [
  "torch>=2.1",
  "transformers>=4.48,<5",
  "accelerate>=0.30",
  "safetensors>=0.4",
  # LoRA repair; 0.12 keeps adapters in float32 on a bfloat16 base.
  "peft>=0.12",
]
report = ["matplotlib>=3.8", "pandas>=2.1"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "types-pyyaml",
]

[project.scripts]
mnlp-eval = "mnlp_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnlp_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "recipes"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # flake8-bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # flake8-simplify
  "RET",       # flake8-return
  "PTH",       # use pathlib
  "ARG",       # unused arguments
  "TID",       # tidy imports
  "RUF",
]
ignore = [
  "B008",    # function call in default argument
  "RUF001",  # ambiguous unicode in multilingual test data
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["src/mnlp_eval"]
strict = true
warn_unreachable = true
# Optional heavy dependencies are not installed in the lint environment.
ignore_missing_imports = true
disallow_untyped_decorators = false

# Modules calling untyped third-party code.
[[tool.mypy.overrides]]
module = [
  "mnlp_eval.models.hf_causal",
  "mnlp_eval.models.hf_seq2seq",
  "mnlp_eval.models.loading",
  "mnlp_eval.metrics.metricx",
  "mnlp_eval.env_capture",
  "mnlp_eval.prune.spec",
  "mnlp_eval.prune.repair",
]
disable_error_code = ["no-untyped-call", "arg-type"]

[[tool.mypy.overrides]]
module = ["mnlp_eval.metrics.surface", "mnlp_eval.metrics.significance"]
# sacrebleu ships py.typed but does not re-export its metric classes.
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pruned model configs name a loader in recipes/, which is not installed.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "gpu: requires a CUDA device",
  "network: requires network access to the Hugging Face Hub",
  "slow: takes more than a few seconds",
  "torch: requires torch, but no GPU and no model download",
]
