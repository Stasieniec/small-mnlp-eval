[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mnlp-eval"
version = "0.1.0"
description = "Reproducible quality and efficiency evaluation for compressed machine translation LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["machine translation", "evaluation", "model compression", "ALMA"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core package is intentionally almost dependency free. It must be
# installable in three mutually incompatible environments (generation, COMET,
# MetricX), so anything that pins numpy, torch or transformers belongs in an
# optional group. See docs/environments.md.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Surface metrics and behavioural metrics. No heavy pins, safe everywhere.
surface = [
  "sacrebleu>=2.4",
  "py3langid>=0.2.2",
]
# Japanese and Korean targets need MeCab. No shipped suite evaluates either, so
# these are separate rather than part of `surface`.
ja = ["sacrebleu[ja]>=2.4"]
ko = ["sacrebleu[ko]>=2.4"]
# Generation stack. This is the environment teammates develop against.
gen = [
  "torch>=2.1",
  # Capped below 5.0 on purpose. unbabel-comet requires transformers<5.0, and
  # ALMA's published numbers were produced with 4.51.1. Keeping the generation
  # and scoring environments on the same major version removes a class of
  # tokenizer-drift questions we would otherwise have to rule out by hand.
  "transformers>=4.45,<5",
  "tokenizers>=0.19,<0.22",
  "accelerate>=0.30",
  "datasets>=3.0,<5",
  "huggingface-hub>=0.24,<1.0",
  "sentencepiece>=0.2",
  "protobuf>=4",
  # Marian tokenizers fall back to a degraded path without it.
  "sacremoses>=0.1",
  "nvidia-ml-py>=12.535",
]
# Compression-specific loaders. Installed on demand, never required.
quant = [
  "bitsandbytes>=0.43",
  "peft>=0.11",
  "optimum>=1.21",
]
# Structured pruning. Pinned tighter than `gen` on purpose: pruning reaches
# into attention module internals, and the 4.48 refactor moved the head count
# out of the module attributes and into the tensor shapes. Supporting both
# sides of that is a compatibility shim this project does not need.
prune = [
  "torch>=2.1",
  "transformers>=4.48,<5",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
vllm = ["vllm>=0.6"]
report = ["matplotlib>=3.8"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "types-pyyaml",
]

[project.scripts]
mnlp-eval = "mnlp_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnlp_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "recipes"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # flake8-bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # flake8-simplify
  "RET",       # flake8-return
  "PTH",       # use pathlib
  "ARG",       # unused arguments
  "TID",       # tidy imports
  "RUF",
]
ignore = [
  "B008",    # function call in default argument, common and readable in CLI code
  "RUF001",  # ambiguous unicode, unavoidable in multilingual test fixtures
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["src/mnlp_eval"]
strict = true
warn_unreachable = true
# Optional heavy dependencies are not installed in the lint environment.
ignore_missing_imports = true
disallow_untyped_decorators = false

# Modules that call into third-party libraries whose type information is
# absent or does not re-export explicitly. The suppressions are scoped to the
# specific error codes and modules involved rather than relaxing strictness
# across the package.
[[tool.mypy.overrides]]
module = [
  "mnlp_eval.models.hf_causal",
  "mnlp_eval.models.hf_seq2seq",
  "mnlp_eval.models.loading",
  "mnlp_eval.metrics.metricx",
  "mnlp_eval.env_capture",
  "mnlp_eval.prune.spec",
]
disable_error_code = ["no-untyped-call", "arg-type"]

[[tool.mypy.overrides]]
module = ["mnlp_eval.metrics.surface", "mnlp_eval.metrics.significance"]
# sacrebleu ships py.typed but does not re-export its metric classes.
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gpu: requires a CUDA device",
  "network: requires network access to the Hugging Face Hub",
  "slow: takes more than a few seconds",
  "torch: requires torch, but no GPU and no model download",
]
